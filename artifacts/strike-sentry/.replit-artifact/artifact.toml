kind = "web"
previewPath = "/"
title = "Strike Sentry"
description = "A risk-first trading operations dashboard for reviewing AI-powered cash-secured put opportunities, validating order safety, and tracking decision history."
version = "1.0.0"
id = "artifacts/strike-sentry"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26193

[services.development]
run = "pnpm --filter @workspace/strike-sentry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/strike-sentry", "run", "build" ]
serve = "static"
publicDir = "artifacts/strike-sentry/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26193"
BASE_PATH = "/"
